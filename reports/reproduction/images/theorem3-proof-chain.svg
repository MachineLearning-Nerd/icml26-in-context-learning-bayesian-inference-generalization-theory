<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Theorem 3 universal proof chain</title>
  <desc id="desc">Five exact proof obligations lead to the posterior-variance bound.</desc>
  <rect width="1000" height="430" rx="24" fill="#071a16"/>
  <text x="50" y="58" fill="#ecfdf5" font-family="sans-serif" font-size="28" font-weight="700">Claim 3: the rate is derived, not fitted</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(35,120)">
      <rect width="170" height="120" rx="16" fill="#123d32" stroke="#34d399"/>
      <text x="85" y="38" fill="#a7f3d0" font-size="16">Likelihood chain</text>
      <text x="85" y="70" fill="#ffffff" font-size="14">P_X cancels</text>
      <text x="85" y="95" fill="#6ee7b7" font-size="13">exact identity</text>
    </g>
    <g transform="translate(225,120)">
      <rect width="170" height="120" rx="16" fill="#123d32" stroke="#34d399"/>
      <text x="85" y="38" fill="#a7f3d0" font-size="16">MGF → C</text>
      <text x="85" y="70" fill="#ffffff" font-size="14">λ inside domain</text>
      <text x="85" y="95" fill="#6ee7b7" font-size="13">216 cases</text>
    </g>
    <g transform="translate(415,120)">
      <rect width="170" height="120" rx="16" fill="#123d32" stroke="#34d399"/>
      <text x="85" y="38" fill="#a7f3d0" font-size="16">Posterior odds</text>
      <text x="85" y="70" fill="#ffffff" font-size="14">S/(1+S) ≤ S</text>
      <text x="85" y="95" fill="#6ee7b7" font-size="13">575 cases</text>
    </g>
    <g transform="translate(605,120)">
      <rect width="170" height="120" rx="16" fill="#123d32" stroke="#34d399"/>
      <text x="85" y="38" fill="#a7f3d0" font-size="16">Total variance</text>
      <text x="85" y="70" fill="#ffffff" font-size="14">(1+4)B_f²</text>
      <text x="85" y="95" fill="#6ee7b7" font-size="13">3,402 cases</text>
    </g>
    <g transform="translate(795,120)">
      <rect width="170" height="120" rx="16" fill="#123d32" stroke="#34d399"/>
      <text x="85" y="38" fill="#a7f3d0" font-size="16">Bayes ≤ minimax</text>
      <text x="85" y="70" fill="#ffffff" font-size="14">posterior mean</text>
      <text x="85" y="95" fill="#6ee7b7" font-size="13">375 cases</text>
    </g>
    <text x="500" y="295" fill="#ffffff" font-size="21" font-weight="700">Symbolic in every k ≥ 1</text>
    <rect x="285" y="325" width="430" height="62" rx="15" fill="#065f46"/>
    <text x="500" y="364" fill="#ecfdf5" font-size="19">4,568 exact checks · coefficient control residual 1/16</text>
  </g>
</svg>
